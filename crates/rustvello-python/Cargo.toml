[package]
name = "rustvello-python"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Python bindings to the Rust code using PyO3"
readme = "../../README.md"

[features]
default = []
sqlite = ["dep:rustvello-sqlite"]
sqlite-fault-injection = ["sqlite", "rustvello-sqlite/fault-injection"]
postgres = ["dep:rustvello-postgres"]
postgres-tls = ["postgres", "rustvello-postgres/tls"]
redis = ["dep:rustvello-redis"]
mongodb = ["dep:rustvello-mongo"]
mongodb3 = ["dep:rustvello-mongo3"]
rabbitmq = ["dep:rustvello-rabbitmq"]
monitoring = ["dep:rustvello-monitoring"]
all-backends = ["sqlite", "postgres-tls", "redis", "mongodb", "mongodb3", "rabbitmq"]

[dependencies]
rustvello = { workspace = true }
glob = { workspace = true }
rustvello-core = { workspace = true }
rustvello-mem = { workspace = true }
rustvello-proto = { workspace = true }
rustvello-otel = { workspace = true }
rustvello-monitoring = { workspace = true, optional = true }
cistell-core = { workspace = true }

rustvello-sqlite = { workspace = true, optional = true }
rustvello-postgres = { workspace = true, optional = true }
rustvello-redis = { workspace = true, optional = true }
rustvello-mongo = { workspace = true, optional = true }
rustvello-mongo3 = { workspace = true, optional = true }
rustvello-rabbitmq = { workspace = true, optional = true }

pyo3 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }

[lints]
workspace = true
