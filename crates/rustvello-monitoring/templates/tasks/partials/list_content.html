{% if !tasks.is_empty() %}
<div class="table-responsive">
  <table class="table table-hover pynmon-table mb-0">
    <thead>
      <tr>
        <th>Task ID</th>
        <th>Invocations</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for task in tasks %}
      <tr>
        <td>
          <a href="/tasks/{{ task.task_id }}" class="text-decoration-none">
            <strong>{{ task.task_id }}</strong>
          </a>
        </td>
        <td>
          <span class="badge bg-primary">{{ task.invocation_count }}</span>
        </td>
        <td>
          <a
            href="/tasks/{{ task.task_id }}"
            class="btn btn-sm btn-outline-primary"
            >Details</a
          >
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="alert alert-info mb-0">No tasks found.</div>
{% endif %}
