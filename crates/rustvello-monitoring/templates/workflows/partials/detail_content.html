{% if !runs.is_empty() %}
<h6 class="section-title">Workflow Runs ({{ runs.len() }})</h6>
<div class="table-responsive">
  <table class="table table-hover pynmon-table mb-0">
    <thead>
      <tr>
        <th>Workflow ID</th>
        <th>Short ID</th>
        <th>Members</th>
      </tr>
    </thead>
    <tbody>
      {% for run in runs %}
      <tr>
        <td><code class="small">{{ run.workflow_id }}</code></td>
        <td>{{ run.short_id }}</td>
        <td><span class="badge bg-primary">{{ run.member_count }}</span></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="text-muted mb-0">No workflow runs recorded yet.</p>
{% endif %}
