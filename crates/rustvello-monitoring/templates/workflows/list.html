{% extends "base.html" %} {% block title %}Workflows — Rustvello Monitor{%
endblock %} {% block content %}
<div class="pynmon-container">
  <div class="row pynmon-row-compact">
    <div class="col-12">
      <div class="card pynmon-card">
        <div
          class="card-header pynmon-card-header d-flex justify-content-between align-items-center"
        >
          <span class="compact-header">
            <span
              class="material-icons align-middle me-1"
              style="font-size: 20px"
              >workspaces</span
            >
            Workflows
          </span>
          <button
            class="btn btn-sm btn-outline-primary"
            hx-get="/workflows/refresh"
            hx-target="#workflows-content"
            hx-swap="innerHTML"
          >
            <span class="material-icons align-middle" style="font-size: 16px"
              >refresh</span
            >
            Refresh
          </button>
        </div>
        <div class="card-body pynmon-card-body">
          <div
            id="workflows-content"
            hx-get="/workflows/refresh"
            hx-trigger="every 10s"
            hx-swap="innerHTML"
          >
            {% include "workflows/partials/list_content.html" %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
