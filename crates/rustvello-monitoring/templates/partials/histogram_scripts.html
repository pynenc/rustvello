<script>
(function () {
  function cssEscape(value) {
    if (window.CSS && CSS.escape) return CSS.escape(value);
    return String(value).replace(/["\\]/g, "\\$&");
  }

  function formatNumber(value) {
    return (Number(value) || 0).toLocaleString();
  }

  function tooltip() {
    var node = document.getElementById("histogram-tooltip");
    if (!node) {
      node = document.createElement("div");
      node.id = "histogram-tooltip";
      node.className = "histogram-tooltip";
      document.body.appendChild(node);
    }
    return node;
  }

  function panelData(panel) {
    if (panel._histogramData) return panel._histogramData;
    var script = document.getElementById(panel.dataset.histogramData || "");
    if (!script) return null;
    try {
      panel._histogramData = JSON.parse(script.textContent || "{}");
    } catch (_) {
      panel._histogramData = null;
    }
    return panel._histogramData;
  }

  function setBucketHover(panel, index, enabled) {
    panel.querySelectorAll('.histogram-bucket[data-bucket-index="' + cssEscape(index) + '"]').forEach(function (peer) {
      peer.classList.toggle("histogram-hovered", enabled);
    });
  }

  function restoreLegend(panel) {
    var time = panel.querySelector("[data-histogram-time]");
    if (time) time.textContent = "";
    panel.querySelectorAll("[data-total]").forEach(function (cell) {
      var value = Number(cell.dataset.total) || 0;
      cell.textContent = formatNumber(value);
      if (cell.dataset.histogramCell && cell.dataset.histogramCell !== "total") {
        cell.classList.toggle("histogram-muted", value === 0);
      }
      cell.classList.remove("histogram-hot");
    });
  }

  function updateLegend(panel, index) {
    var data = panelData(panel);
    if (!data || index === null || index === undefined) {
      restoreLegend(panel);
      return;
    }
    var time = panel.querySelector("[data-histogram-time]");
    if (time) time.textContent = data.labels[index] || "";

    data.tasks.forEach(function (task) {
      var row = panel.querySelector('[data-histogram-task-id="' + cssEscape(task.id) + '"]');
      if (!row) return;
      var rowTotal = 0;
      data.groups.forEach(function (group) {
        var series = (task.counts_by_runtime || {})[group.id] || [];
        var count = Number(series[index]) || 0;
        rowTotal += count;
        var cell = row.querySelector('[data-histogram-cell="' + cssEscape(group.id) + '"]');
        if (cell) {
          cell.textContent = formatNumber(count);
          cell.classList.toggle("histogram-muted", count === 0);
          cell.classList.add("histogram-hot");
        }
      });
      var totalCell = row.querySelector('[data-histogram-cell="total"]');
      if (totalCell) {
        totalCell.textContent = formatNumber(rowTotal);
        totalCell.classList.add("histogram-hot");
      }
    });

    var grandTotal = 0;
    data.groups.forEach(function (group) {
      var columnTotal = 0;
      data.tasks.forEach(function (task) {
        var series = (task.counts_by_runtime || {})[group.id] || [];
        columnTotal += Number(series[index]) || 0;
      });
      grandTotal += columnTotal;
      var footer = panel.querySelector('[data-histogram-footer="' + cssEscape(group.id) + '"]');
      if (footer) {
        footer.textContent = formatNumber(columnTotal);
        footer.classList.add("histogram-hot");
      }
      var badge = panel.querySelector('[data-histogram-worker-badge="' + cssEscape(group.id) + '"]');
      if (badge) {
        var workers = Number((group.worker_counts || [])[index]) || 0;
        badge.textContent = formatNumber(workers);
        badge.classList.add("histogram-hot");
      }
    });

    var grand = panel.querySelector('[data-histogram-footer="total"]');
    if (grand) {
      grand.textContent = formatNumber(grandTotal);
      grand.classList.add("histogram-hot");
    }
  }

  function tooltipLeft(clientX) {
    return Math.max(8, Math.min(clientX + 12, window.innerWidth - 460));
  }

  function enterBucket(panel, bucket, event) {
    var tip = tooltip();
    var clientX = Number.isFinite(event.clientX) ? event.clientX : window.innerWidth / 2;
    var clientY = Number.isFinite(event.clientY) ? event.clientY : 48;
    tip.textContent = bucket.dataset.tooltip || "";
    tip.style.display = "block";
    tip.style.left = tooltipLeft(clientX) + "px";
    tip.style.top = Math.max(8, clientY - 38) + "px";
    setBucketHover(panel, bucket.dataset.bucketIndex, true);
    updateLegend(panel, Number(bucket.dataset.bucketIndex));
    if (window.rustvelloSetTimeCursor) {
      window.rustvelloSetTimeCursor(bucket.dataset.bucketStart, bucket.dataset.bucketEnd, true);
    }
  }

  function leaveBucket(panel, bucket) {
    tooltip().style.display = "none";
    setBucketHover(panel, bucket.dataset.bucketIndex, false);
    updateLegend(panel, null);
    if (window.rustvelloSetTimeCursor) window.rustvelloSetTimeCursor(null, null, false);
  }

  function bind(panel) {
    if (panel.dataset.histogramBound) return;
    panel.dataset.histogramBound = "1";
    panelData(panel);

    panel.addEventListener("mouseover", function (event) {
      var bucket = event.target.closest(".histogram-bucket");
      if (!bucket || !panel.contains(bucket) || bucket.contains(event.relatedTarget)) return;
      enterBucket(panel, bucket, event);
    });
    panel.addEventListener("mouseout", function (event) {
      var bucket = event.target.closest(".histogram-bucket");
      if (!bucket || !panel.contains(bucket) || bucket.contains(event.relatedTarget)) return;
      leaveBucket(panel, bucket);
    });
    panel.addEventListener("mousemove", function (event) {
      if (!event.target.closest(".histogram-bucket")) return;
      var tip = tooltip();
      tip.style.left = tooltipLeft(event.clientX) + "px";
      tip.style.top = Math.max(8, event.clientY - 38) + "px";
    });
    panel.addEventListener("focusin", function (event) {
      var bucket = event.target.closest(".histogram-bucket");
      if (bucket) enterBucket(panel, bucket, event);
    });
    panel.addEventListener("focusout", function (event) {
      var bucket = event.target.closest(".histogram-bucket");
      if (bucket) leaveBucket(panel, bucket);
    });
    panel.addEventListener("click", function (event) {
      var row = event.target.closest(".histogram-task-row");
      if (!row || !panel.contains(row)) return;
      var taskId = row.dataset.histogramTaskId;
      if (!taskId) return;
      row.classList.toggle("histogram-row-hidden");
      var muted = row.classList.contains("histogram-row-hidden");
      panel.querySelectorAll('.histogram-task-segment[data-task-id="' + cssEscape(taskId) + '"]').forEach(function (segment) {
        segment.classList.toggle("histogram-series-muted", muted);
      });
    });
    panel.addEventListener("change", function (event) {
      var input = event.target.closest(".histogram-status-toggle");
      if (!input || !panel.contains(input)) return;
        var selected = Array.from(panel.querySelectorAll(".histogram-status-toggle:checked")).map(function (item) { return item.value; });
        if (panel.dataset.histogramForm) {
          var form = document.getElementById(panel.dataset.histogramForm);
          if (form) {
            var hidden = form.querySelector('input[name="histogram_status"]');
            if (!hidden) {
              hidden = document.createElement("input");
              hidden.type = "hidden";
              hidden.name = "histogram_status";
              form.appendChild(hidden);
            }
            hidden.value = selected.join(",");
            form.requestSubmit();
            return;
          }
        }
        var url = new URL(window.location.href);
        url.searchParams.set("histogram_status", selected.join(","));
        window.location.assign(url.toString());
    });
    restoreLegend(panel);
  }

  function bindAll() {
    document.querySelectorAll("[data-histogram-panel]").forEach(bind);
  }

  document.addEventListener("DOMContentLoaded", bindAll);
  document.body.addEventListener("htmx:afterSwap", bindAll);
})();
</script>
