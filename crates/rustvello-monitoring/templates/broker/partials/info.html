<div class="row g-3">
  <!-- Configuration Card -->
  <div class="col-md-6">
    <div class="metric-card">
      <h6 class="section-title">Configuration</h6>
      <div class="metric-grid">
        <div class="metric-item">
          <span class="metric-label">Pending Invocations</span>
          <span
            class="badge {% if pending_count > 0 %}bg-warning{% else %}bg-success{% endif %}"
          >
            {{ pending_count }}
          </span>
        </div>
      </div>
      <div class="mt-3">
        <form method="post" action="/broker/purge">
          <button
            type="submit"
            class="btn btn-outline-danger btn-sm w-100"
            onclick="return confirm('Are you sure you want to purge all pending invocations?')"
          >
            <span
              class="material-icons align-middle me-1"
              style="font-size: 14px"
              >delete</span
            >
            Purge Queue
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Queue Status Card -->
  <div class="col-md-6">
    <div class="metric-card text-center">
      <h6 class="section-title">Queue Status</h6>
      <div class="py-3">
        <div
          class="display-6 fw-bold {% if pending_count > 0 %}text-warning{% else %}text-success{% endif %}"
        >
          {{ pending_count }}
        </div>
        <div class="text-muted small">Pending Invocations</div>
        {% if pending_count > 0 %}
        <div class="mt-2">
          <small class="text-warning">
            <span
              class="material-icons"
              style="font-size: 16px; vertical-align: text-bottom"
              >warning</span
            >
            Queue is not empty
          </small>
        </div>
        {% else %}
        <div class="mt-2">
          <small class="text-success">
            <span
              class="material-icons"
              style="font-size: 16px; vertical-align: text-bottom"
              >check_circle</span
            >
            Queue is empty
          </small>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
