[package]
name = "rustvello-monitoring"
description = "Web-based monitoring dashboard for Rustvello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustvello-core = { workspace = true }
rustvello-proto = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
askama = "0.16.1"
tokio = { workspace = true }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
include_dir = "0.7"
mime_guess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
regex = "1.13.1"
url = "2"

[dev-dependencies]
rustvello = { workspace = true, features = ["mem", "rayon"] }
rustvello-core = { workspace = true }
rustvello-mem = { workspace = true }
rustvello-proto = { workspace = true }
reqwest = { version = "0.13.5", features = ["json", "form"] }
regex = "1.13.1"
tokio = { workspace = true, features = ["test-util", "macros", "net", "signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
