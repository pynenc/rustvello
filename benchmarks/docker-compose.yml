# Brokers and databases for the Rustvello vs Celery benchmark (benchmarks/README.md).
# Unique project, container names and host ports so it does not collide with
# other local stacks. Credentials are throwaway values for a loopback-only stack.
name: rvbench

services:
  redis:
    image: redis:7.4.1-alpine
    container_name: rvbench-redis
    # Durable like the other systems: append-only file, fsync on every write.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "always",
        "--save",
        "",
      ]
    ports:
      - "127.0.0.1:${RVBENCH_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13.7-alpine
    container_name: rvbench-rabbitmq
    ports:
      - "127.0.0.1:${RVBENCH_AMQP_PORT:-55673}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 40

  postgres:
    image: postgres:16
    container_name: rvbench-postgres
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    # Defaults kept on purpose: fsync=on, synchronous_commit=on.
    ports:
      - "127.0.0.1:${RVBENCH_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench"]
      interval: 2s
      retries: 30
