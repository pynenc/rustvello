[package]
name = "monitoring-server-example"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
rustvello = { workspace = true, features = ["mem"] }
rustvello-core = { workspace = true }
rustvello-proto = { workspace = true }
rustvello-mem = { workspace = true }
rustvello-monitoring = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
