
[workspace]
package-name = "rustvello-workspace"
members = [
  "crates/*",
  "py-rustvello",
]
resolver = "2"

default-members = [
  "crates/rustvello-core",
  "crates/rustvello",
  "crates/*",
]

[workspace.package]
version = "0.0.25"
edition = "2021"
rust-version = "1.78"
homepage = "https://pynenc.org"
repository = "https://github.com/pynenc/rustvello"
authors = ["Luis Diaz <code.luis.diaz@proton.me"]
license = "MIT"

[workspace.dependencies]
rustvello = { version = "0.0.25", path = "crates/rustvello" }
rustvello-client = { version = "0.0.25", path = "crates/rustvello-client" }
rustvello-core = { version = "0.0.25", path = "crates/rustvello-core" }
rustvello-python = { version = "0.0.25", path = "crates/rustvello-python" }
rustvello-proto = { version = "0.0.25", path = "crates/rustvello-proto" }
rustvello-record = { version = "0.0.25", path = "crates/rustvello-record" }

async-trait = "0.1"
chrono = "0.4.38"
env_logger = "0.11.5"
hashbrown = "0.15.0"
log = "0.4"
pyo3 = "0.22.0" # TODO upgrade if pyo2-asyncio is not required : "0.22.5"

# pyo3-asyncio = "0.22.0" # TODO is it required?
serde = "1.0.214"
serde_json = "1.0.132"
thiserror = "1.0.66"
tokio = { version = "1.4.1", features = ["full"] }
twox-hash = "1.6.3"
uuid = { version = "1.1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
debug = "line-tables-only"

[profile.dist-release]
inherits = "release"
codegen-units = 1
debug = false
lto = "fat"
