
[workspace]
members = [
  "crates/*",
  "py-rustvello",
]
exclude = ["fuzz"]
resolver = "2"

default-members = [
  "crates/rustvello-core",
  "crates/rustvello-proto",
  "crates/rustvello-mem",
  "crates/rustvello-sqlite",
  "crates/rustvello-postgres",
  "crates/rustvello-prometheus",
  "crates/rustvello",
  "crates/rustvello-cli",
  "crates/rustvello-macros",
  "crates/rustvello-monitoring",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
homepage = "https://pynenc.org"
repository = "https://github.com/pynenc/rustvello"
authors = ["Luis Diaz <code.luis.diaz@proton.me>"]
license = "MIT"

[workspace.dependencies]
rustvello = { version = "0.1.0", path = "crates/rustvello" }
rustvello-core = { version = "0.1.0", path = "crates/rustvello-core" }
rustvello-proto = { version = "0.1.0", path = "crates/rustvello-proto" }
rustvello-mem = { version = "0.1.0", path = "crates/rustvello-mem" }
rustvello-sqlite = { version = "0.1.0", path = "crates/rustvello-sqlite" }
rustvello-python = { version = "0.1.0", path = "crates/rustvello-python" }
rustvello-macros = { version = "0.1.0", path = "crates/rustvello-macros" }
rustvello-redis = { version = "0.1.0", path = "crates/rustvello-redis" }
rustvello-mongo = { version = "0.1.0", path = "crates/rustvello-mongo" }
rustvello-mongo3 = { version = "0.1.0", path = "crates/rustvello-mongo3" }
rustvello-rabbitmq = { version = "0.1.0", path = "crates/rustvello-rabbitmq" }
rustvello-prometheus = { version = "0.1.0", path = "crates/rustvello-prometheus" }
rustvello-postgres = { version = "0.1.0", path = "crates/rustvello-postgres" }
rustvello-monitoring = { version = "0.1.0", path = "crates/rustvello-monitoring" }
rustvello-test-suite = { version = "0.1.0", path = "crates/rustvello-test-suite" }
cistell-core   = { version = "0.1.0", features = ["toml", "tracing"] }
cistell-macros = "0.1.0"

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.5", features = ["async_tokio"] }
env_logger = "0.11"
hostname = "0.4"
inventory = "0.3"
log = "0.4"
lru = "0.12"
proptest = "1"
pyo3 = { version = "0.22", features = ["multiple-pymethods"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
croner = "3"
lapin = "2"
futures-util = "0.3"
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
rayon = "1.11"
testcontainers = "0.23"
trybuild = "1"
testcontainers-modules = { version = "0.11", features = ["redis", "mongo", "postgres", "rabbitmq"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
module_name_repetitions = "allow"
wildcard_imports = "warn"
clone_on_ref_ptr = "warn"
redundant_closure_for_method_calls = "warn"
unnecessary_wraps = "warn"
map_unwrap_or = "warn"

[profile.release]
lto = "thin"
debug = "line-tables-only"

[profile.dist-release]
inherits = "release"
codegen-units = 1
debug = false
lto = "fat"
