version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: ci
    labels: ["skip-changelog"]

  # Rust Components
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: build(rust)
      prefix-development: chore(rust)
    labels: ["skip-changelog"]
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/py-rustvello"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: build(python)
      prefix-development: chore(python)
    labels: ["skip-changelog"]
    groups:
      rust-python-dependencies:
        patterns: ["*"]

  # Python Components
  - package-ecosystem: pip
    directory: "/py-rustvello"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: chore(python)
    labels: ["skip-changelog"]
    groups:
      python-dependencies:
        patterns: ["*"]
