# One Dependabot pull request a month for every ecosystem (Rust crates,
# Python packages, GitHub Actions), so one CI run checks all updates together.
#
# - cooldown: a version is proposed only 15 days after its release;
#   security updates are not delayed.
# - patch releases are skipped; minor and major ones are grouped.
# - no automatic rebase when main moves (comment "@dependabot rebase").
#
# The root Cargo.lock and uv.lock cover py-rustvello too, so each ecosystem
# has one entry at "/".
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
    labels: ["dependencies", "skip-changelog"]
    commit-message:
      prefix: build(deps)

updates:
  - package-ecosystem: cargo
    directory: "/"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    rebase-strategy: disabled
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: uv
    directory: "/"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    rebase-strategy: disabled
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    rebase-strategy: disabled
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
