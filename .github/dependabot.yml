# Version updates wait 15 days after a release (cooldown) and skip patch
# releases; security updates are not delayed. The root Cargo.lock and uv.lock
# cover py-rustvello too, so each ecosystem has one entry at "/".
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: ["skip-changelog"]

  # Rust crates, including py-rustvello
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: build(rust)
      prefix-development: chore(rust)
    labels: ["skip-changelog"]
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor"]

  # Python (uv workspace: py-rustvello and the dev tooling)
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 15
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: chore(python)
    labels: ["skip-changelog"]
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor"]
