name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels its older run: macOS runners are the
# scarce resource, and a superseded run would hold them for 30+ minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-compatibility:
    name: Read supported Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every supported Python on Ubuntu. macOS: the oldest and newest only on
      # pull requests (macOS runners are scarce), every version on main.
      - name: Read package metadata
        id: versions
        env:
          EVENT: ${{ github.event_name }}
        run: |
          versions=$(python scripts/python_compatibility.py --format json)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          python - "$versions" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          versions = json.loads(sys.argv[1])
          macos = versions if os.environ["EVENT"] != "pull_request" else list(dict.fromkeys([versions[0], versions[-1]]))
          cells = [{"os": "ubuntu-24.04", "python-version": v} for v in versions]
          cells += [{"os": "macos-latest", "python-version": v} for v in macos]
          print("matrix=" + json.dumps({"include": cells}))
          PY

  quality:
    name: Code quality (lint, format, clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies and pre-commit hooks
        run: make install

      - name: Run code quality checks
        run: make check

  # The Rust workspace does not depend on the Python version: test it once
  # per system instead of once per matrix cell.
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The rustvello-python crate's own tests link libpython.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests

      - name: Run the Rust workspace tests
        run: make test-rust

      # Fault suites kill SQLite processes; Linux is enough, the release gate
      # runs them again before a release.
      - name: Run the fault-injection suites
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: make test-fault

  python-tests:
    name: Python tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: python-compatibility
    strategy:
      # ubuntu-24.04: a runner image setup-python fully supports for every
      # declared Python version.
      matrix: ${{ fromJSON(needs.python-compatibility.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # One cache per system for every Python version: the extension's Rust
      # dependencies are the same, only the final link differs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-extension

      - name: Install dependencies and build the extension
        run: make install

      - name: Run the Python tests
        run: make test-python-only

      - name: Upload coverage reports to Codecov (Python 3.12 on Ubuntu only)
        uses: codecov/codecov-action@v7
        if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04' }}

  check-docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Sphinx documentation
        run: make docs-build

      - name: Build Rust API docs (docs.rs compat)
        run: cargo doc --workspace --all-features --no-deps --exclude py-rustvello

  readme-examples:
    name: README examples (built wheel and crate)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: README blocks match the example files
        run: python scripts/readme_examples.py check

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path py-rustvello/Cargo.toml --interpreter python3.12 --out dist

      - name: Run the Python examples against the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/readme"
          "$RUNNER_TEMP/readme/bin/pip" install --no-index --find-links dist rustvello
          "$RUNNER_TEMP/readme/bin/python" scripts/readme_examples.py run --language python

      - name: Run the Rust examples against the crate
        run: python scripts/readme_examples.py run --language rust

      # A fresh agent with only the skill: its examples and scripts run from a
      # copy of skills/rustvello against the same wheel, so the skill cannot drift.
      - name: Agent skill examples against the built wheel
        run: '"$RUNNER_TEMP/readme/bin/python" scripts/readme_examples.py skill'

      - name: Eval harness self-test (mock models, no keys)
        run: |
          "$RUNNER_TEMP/readme/bin/pip" install pytest
          "$RUNNER_TEMP/readme/bin/python" evals/run.py api-surface
          "$RUNNER_TEMP/readme/bin/python" -m pytest evals/tests -q -p no:cacheprovider

      - name: Run the Celery migration example (before on Celery, after on the built wheel)
        working-directory: py-rustvello/examples/celery_migration
        run: |
          "$RUNNER_TEMP/readme/bin/pip" install celery==5.6.3
          "$RUNNER_TEMP/readme/bin/python" celery_app.py
          "$RUNNER_TEMP/readme/bin/python" rustvello_app.py

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check links into this repository (offline, against this branch)
        run: python3 scripts/check_repo_links.py

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml --no-progress
            README.md '*.md' py-rustvello/README.md 'crates/*/README.md' 'docs/**/*.md' 'skills/**/*.md' evals/README.md benchmarks/README.md

  publish-dry-run:
    name: Verify crates compile (all features)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # PyO3 builds against the Python on PATH; the runner's own (3.14 on
      # Ubuntu 26.04) is newer than PyO3 0.22 supports.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace compiles with all features
        run: cargo check --workspace --all-features --all-targets

      - name: Verify root crate can be packaged
        run: cargo package -p rustvello-proto --no-verify

  fuzz:
    name: Fuzz testing (30s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz JSON trigger parsing
        run: cargo +nightly fuzz run fuzz_json_trigger -- -max_total_time=30

      - name: Fuzz TOML config parsing
        run: cargo +nightly fuzz run fuzz_toml_config -- -max_total_time=30
