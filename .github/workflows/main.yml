name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  python-compatibility:
    name: Read supported Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package metadata
        id: versions
        run: echo "versions=$(python scripts/python_compatibility.py --format json)" >> "$GITHUB_OUTPUT"

  quality:
    name: Code quality (lint, format, clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies and pre-commit hooks
        run: make install

      - name: Run code quality checks
        run: make check

  tests-and-type-check:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: python-compatibility
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ${{ fromJSON(needs.python-compatibility.outputs.versions) }}
        rust-version: ["stable"]
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Upload coverage reports to Codecov (Python 3.12 on Ubuntu only)
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}

  check-docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Sphinx documentation
        run: make docs-build

      - name: Build Rust API docs (docs.rs compat)
        run: cargo doc --workspace --all-features --no-deps --exclude py-rustvello

  readme-examples:
    name: README examples (built wheel and crate)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: README blocks match the example files
        run: python scripts/readme_examples.py check

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path py-rustvello/Cargo.toml --interpreter python3.12 --out dist

      - name: Run the Python examples against the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/readme"
          "$RUNNER_TEMP/readme/bin/pip" install --no-index --find-links dist rustvello
          "$RUNNER_TEMP/readme/bin/python" scripts/readme_examples.py run --language python

      - name: Run the Rust examples against the crate
        run: python scripts/readme_examples.py run --language rust

      - name: Run the Celery migration example (before on Celery, after on the built wheel)
        working-directory: py-rustvello/examples/celery_migration
        run: |
          "$RUNNER_TEMP/readme/bin/pip" install celery==5.6.3
          "$RUNNER_TEMP/readme/bin/python" celery_app.py
          "$RUNNER_TEMP/readme/bin/python" rustvello_app.py

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml --no-progress
            README.md '*.md' py-rustvello/README.md 'crates/*/README.md' 'docs/**/*.md' benchmarks/README.md

  publish-dry-run:
    name: Verify crates compile (all features)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace compiles with all features
        run: cargo check --workspace --all-features --all-targets

      - name: Verify root crate can be packaged
        run: cargo package -p rustvello-proto --no-verify

  fuzz:
    name: Fuzz testing (30s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz JSON trigger parsing
        run: cargo +nightly fuzz run fuzz_json_trigger -- -max_total_time=30

      - name: Fuzz TOML config parsing
        run: cargo +nightly fuzz run fuzz_toml_config -- -max_total_time=30
