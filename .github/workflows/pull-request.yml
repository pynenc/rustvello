# Pull request metadata in one workflow: the conventional title and the label
# the release notes are built from. Code checks live in main.yml.
name: PR checks

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  labels:
    name: Release label
    runs-on: ubuntu-latest
    steps:
      - name: Label from the conventional title
        uses: bcoe/conventional-release-labels@v1
        with:
          type_labels: |
            {
              "feat": "feature",
              "fix": "fix",
              "docs": "docs",
              "chore": "chore",
              "ci": "chore",
              "build": "chore",
              "test": "chore",
              "perf": "refactor",
              "refactor": "refactor",
              "security": "security",
              "deps": "dependencies",
              "breaking": "breaking"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The PR has a release label
        uses: danielchabr/pr-labels-checker@v3.3
        with:
          hasSome: feature,fix,docs,chore,refactor,security,dependencies,breaking
          githubToken: ${{ secrets.GITHUB_TOKEN }}
