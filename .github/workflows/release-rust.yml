name: Release Rust

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check-version.outputs.is_release }}
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if version is published on crates.io
        id: check-version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          # Check if this version already exists on crates.io
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/rustvello/$VERSION")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Version $VERSION already published on crates.io — skipping"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not found on crates.io — will publish"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  verify-docs:
    name: Verify docs build
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust API docs (docs.rs compat)
        run: cargo doc --workspace --all-features --no-deps --exclude py-rustvello

  rust-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check-version, verify-docs]
    if: needs.check-version.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local crate="$1"
            local max_retries=3
            echo "Publishing $crate..."
            for attempt in $(seq 1 $max_retries); do
              output=$(cargo publish -p "$crate" --no-verify 2>&1) && {
                echo "$output"
                echo "✅ $crate published"
                sleep 30
                return 0
              }
              echo "$output"
              if echo "$output" | grep -q "already exists"; then
                echo "⏭️ $crate already published, skipping"
                return 0
              fi
              if echo "$output" | grep -q "429\|Too Many Requests"; then
                echo "⏳ Rate limited, waiting 5 minutes before retry ($attempt/$max_retries)..."
                sleep 300
              else
                echo "❌ $crate failed with unexpected error"
                return 0
              fi
            done
            echo "❌ $crate failed after $max_retries retries"
          }

          # Layer 0: no internal deps
          publish rustvello-proto

          # Layer 1: depends on proto
          publish rustvello-core

          # Layer 2: depends on core (test-suite must come first — backends dev-depend on it)
          publish rustvello-test-suite
          publish rustvello-macros
          publish rustvello-mem
          publish rustvello-sqlite
          publish rustvello-redis
          publish rustvello-postgres
          publish rustvello-mongo
          publish rustvello-mongo3
          publish rustvello-rabbitmq
          publish rustvello-prometheus

          # Layer 3: depends on core + backends
          publish rustvello
          publish rustvello-monitoring

          # Layer 4: depends on rustvello
          publish rustvello-cli

      - name: Summary
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "### 🦀 Published to crates.io" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
