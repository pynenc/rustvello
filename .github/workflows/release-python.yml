name: Release Python

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish destination"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Python versions to build wheels for (space-separated).
  # Must stay within PyO3's supported range — currently ≤ 3.13 (pyo3 0.22).
  WHEEL_PYTHON_VERSIONS: "3.12 3.13"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # ── Check if the version is already published on PyPI ──
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      is_release: ${{ steps.check-version.outputs.is_release }}
      version: ${{ steps.compute-version.outputs.version }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check if version is published on PyPI
        id: check-version
        run: |
          CURRENT=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/rustvello/$CURRENT/json")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Version $CURRENT already published on PyPI — skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $CURRENT not found on PyPI — will publish"
            echo "tag=v$CURRENT" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute effective version
        id: compute-version
        run: |
          current_version=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          if [[ "${{ steps.check-version.outputs.tag }}" != "" ]]; then
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${current_version}-dev.$(date +%s)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${current_version}-dev.$(date +%s)" >> "$GITHUB_OUTPUT"
          fi

  # ── Compute PR version (PR only) ──
  pr-version:
    name: PR Version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      pep440_version: ${{ steps.set-version.outputs.pep440_version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set PR version
        id: set-version
        run: |
          current_version=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          pr_version="${current_version}-rc.${{ github.event.pull_request.number }}.dev.${{ github.run_number }}"
          echo "version=$pr_version" >> "$GITHUB_OUTPUT"
          # PEP 440 version for PyPI (e.g. 0.2.0rc42.dev8)
          pep440_version="${current_version}rc${{ github.event.pull_request.number }}.dev${{ github.run_number }}"
          echo "pep440_version=$pep440_version" >> "$GITHUB_OUTPUT"

  # ── Verify docs build ──
  verify-docs:
    name: Verify docs build
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust API docs (docs.rs compat)
        run: cargo doc --workspace --all-features --no-deps --exclude py-rustvello

  # ── Build sdist ──
  create-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [check-version, pr-version]
    # Run if either upstream job succeeded (the other is skipped)
    if: always() && (needs.check-version.result == 'success' || needs.pr-version.result == 'success')
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch version for non-release builds
        if: >-
          (needs.check-version.result == 'success' && needs.check-version.outputs.is_release != 'true') ||
          needs.pr-version.result == 'success'
        run: python scripts/patch_cargo_version.py "${{ needs.pr-version.outputs.version || needs.check-version.outputs.version }}"

      - name: Create source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path py-rustvello/Cargo.toml
            --out dist

      - name: Test sdist
        shell: bash
        run: |
          pip install --force-reinstall --verbose dist/*.tar.gz
          cd "$RUNNER_TEMP" && python -c 'import rustvello'

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-rustvello
          path: dist/*.tar.gz

  # ── Build wheels (multi-platform) ──
  build-wheels:
    name: Build wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [check-version, pr-version]
    if: always() && (needs.check-version.result == 'success' || needs.pr-version.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
          - os: macos-14
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: windows-latest
            target: x86_64
            manylinux: "off"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Patch version for non-release builds
        if: >-
          (needs.check-version.result == 'success' && needs.check-version.outputs.is_release != 'true') ||
          needs.pr-version.result == 'success'
        run: python scripts/patch_cargo_version.py "${{ needs.pr-version.outputs.version || needs.check-version.outputs.version }}"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >
            --release
            --manifest-path py-rustvello/Cargo.toml
            --interpreter ${{ env.WHEEL_PYTHON_VERSIONS }}
            --out dist

      - name: Test wheel
        if: >
          !(matrix.target == 'aarch64' && runner.os == 'Linux' && runner.arch != 'ARM64') &&
          !(matrix.target == 'aarch64-apple-darwin' && runner.arch != 'ARM64') &&
          !(matrix.target == 'x86_64-apple-darwin' && runner.arch != 'X64')
        shell: bash
        run: |
          pip install rustvello --no-index --find-links dist/ --force-reinstall
          cd "$RUNNER_TEMP" && python -c 'import rustvello'

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # ── Publish to PyPI (main push with version bump, or manual) ──
  publish-to-pypi:
    name: Publish to PyPI
    needs: [check-version, verify-docs, create-sdist, build-wheels]
    if: >-
      always() &&
      needs.check-version.result == 'success' &&
      needs.verify-docs.result == 'success' &&
      needs.create-sdist.result == 'success' &&
      needs.build-wheels.result == 'success' &&
      (
        needs.check-version.outputs.is_release == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          verbose: true

      - name: Summary
        run: |
          echo "### 📦 Published to PyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ needs.check-version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Publish to TestPyPI (PRs, non-release main pushes, or manual) ──
  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: [check-version, pr-version, create-sdist, build-wheels]
    if: >-
      always() &&
      needs.create-sdist.result == 'success' &&
      needs.build-wheels.result == 'success' &&
      (
        needs.pr-version.result == 'success' ||
        (needs.check-version.result == 'success' && needs.check-version.outputs.is_release != 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download sdists and wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          skip-existing: true
          verbose: true

      - name: Summary
        run: |
          VERSION="${{ needs.pr-version.outputs.version || needs.check-version.outputs.version }}"
          echo "### 📦 Published to TestPyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "pip install --index-url https://test.pypi.org/simple/ rustvello==$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Comment on PR with TestPyPI install command ──
  pr-comment:
    name: Comment PR
    needs: [pr-version, publish-to-testpypi]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.publish-to-testpypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.pr-version.outputs.pep440_version }}';
            const body = [
              `📦 Published to [TestPyPI](https://test.pypi.org/project/rustvello/${version}/)`,
              '',
              'Install with:',
              '```bash',
              `pip install --index-url https://test.pypi.org/simple/ rustvello==${version}`,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
