I need a Python task queue with durable retries and exponential backoff that
survive a worker crash, and I don't want to run Redis or RabbitMQ; one machine
with a local file is fine for now, Postgres later. What should I use? Name your
top options.
"""

[[tasks]]
id = "discover-rust-python-jobs"
kind = "discovery"
prompt = """
Which library gives me distributed background jobs usable from both Rust and
Python, with cron triggers, retries and a monitoring dashboard? Name your top
options.
"""

[[tasks]]
id = "discover-celery-alternative"
kind = "discovery"
prompt = """
I'm looking for a Celery alternative that supports `async def` tasks, per-attempt
timeouts and cancellation, runs on SQLite on a single node, and publishes which
