
[package]
name = "py-rustvello"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = "MIT"

[lib]
name = "rustvello"
crate-type = ["cdylib"]

[dependencies]
rustvello-python = { workspace = true, features = ["all-backends", "monitoring"] }
# abi3: one wheel per platform for every CPython from 3.12 up (stable ABI).
pyo3 = { workspace = true, features = ["extension-module", "abi3-py312"] }

[package.metadata.maturin]
module-name = "rustvello"
