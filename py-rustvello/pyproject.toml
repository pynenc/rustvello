# py-rustvello/pyproject.toml

[project]
name = "rustvello"
# version = "0.0.1"
dynamic = ["version"]
description = "Distributed task queue and workflow runtime with a Rust core: retries, priorities, triggers and pluggable backends for Python and Rust"
authors = [{ name = "Luis Diaz" }]
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "task queue",
    "distributed tasks",
    "background jobs",
    "job queue",
    "workflow",
    "workflows",
    "worker",
    "scheduler",
    "cron",
    "rust",
    "celery alternative",
]
requires-python = ">=3.9,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.optional-dependencies]
telemetry = ["opentelemetry-api==1.41.1"]

[project.urls]
Homepage = "https://rustvello.readthedocs.io"
Documentation = "https://rustvello.readthedocs.io"
Repository = "https://github.com/pynenc/rustvello"
Changelog = "https://rustvello.readthedocs.io/en/latest/changelog.html"
Issues = "https://github.com/pynenc/rustvello/issues"

# Entry point moved to pynenc_repo (NB_00)

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.2.6,<8.0",
    "ruff>=0.14.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.3.2"]

[tool.maturin]
module-name = "rustvello"
bindings = "pyo3"
include = [
    { path = "README.md", format = "sdist" },
    { path = "rustvello/py.typed", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]

features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py39"
line-length = 120
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
lint.ignore = [
    "E501",  # line too long (handled by formatter)
    "C901",  # too complex
    "UP037", # remove quotes from type annotation
]
lint.per-file-ignores = { "tests/**/*.py" = ["F403"] }

[tool.mypy]
files = ["rustvello"]
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = "venv|env|\\.venv"
show_error_codes = true
pretty = true
allow_redefinition = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["rustvello"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
