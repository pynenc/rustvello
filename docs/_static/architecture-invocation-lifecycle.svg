<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Rustvello invocation lifecycle and ownership flow</title>
  <desc id="desc">A task call passes through app submission, orchestration and storage, broker delivery, atomic concurrency slot reservation, runner ownership, execution, and terminal persistence.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#52606d"/></marker><style>.h{font:700 25px Inter,system-ui;fill:#24313d}.s{font:13px Inter,system-ui;fill:#52606d}.t{font:600 14px Inter,system-ui;fill:#24313d}.n{font:12px Inter,system-ui;fill:#52606d}.b{stroke-width:2;rx:7}.l{stroke:#52606d;stroke-width:1.7;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="610" fill="#f8fafb"/><text x="48" y="48" class="h">Invocation lifecycle and ownership</text><text x="48" y="73" class="s">The coordinator sequences effects; each backend owns one kind of durable state</text>
  <rect x="45" y="150" width="160" height="78" class="b" fill="#f3ecfa" stroke="#77559a"/><text x="125" y="180" text-anchor="middle" class="t">Caller</text><text x="125" y="202" text-anchor="middle" class="n">task + arguments</text>
  <rect x="250" y="150" width="175" height="78" class="b" fill="#eaf7f6" stroke="#2f7f78"/><text x="338" y="180" text-anchor="middle" class="t">RustvelloApp</text><text x="338" y="202" text-anchor="middle" class="n">validate + submit</text>
  <rect x="470" y="130" width="220" height="118" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="580" y="162" text-anchor="middle" class="t">Coordinator</text><text x="580" y="186" text-anchor="middle" class="n">status + side effects</text><text x="580" y="208" text-anchor="middle" class="n">workflow + concurrency</text><text x="580" y="230" text-anchor="middle" class="n">history + trigger hooks</text>
  <rect x="750" y="105" width="180" height="74" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="840" y="134" text-anchor="middle" class="t">Orchestrator</text><text x="840" y="156" text-anchor="middle" class="n">status and ownership</text>
  <rect x="750" y="205" width="180" height="74" class="b" fill="#e8f3ec" stroke="#3f7d5c"/><text x="840" y="234" text-anchor="middle" class="t">State backend</text><text x="840" y="256" text-anchor="middle" class="n">DTO, history, result</text>
  <rect x="975" y="150" width="175" height="78" class="b" fill="#fff0f4" stroke="#a44e69"/><text x="1063" y="180" text-anchor="middle" class="t">Broker</text><text x="1063" y="202" text-anchor="middle" class="n">queue ownership</text>
  <path d="M205 189H242" class="l"/><path d="M425 189H462" class="l"/><path d="M690 166L742 145" class="l"/><path d="M690 212L742 235" class="l"/><path d="M930 142L967 177" class="l"/>
  <rect x="760" y="390" width="230" height="84" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="875" y="420" text-anchor="middle" class="t">Slot reservation + claim</text><text x="875" y="442" text-anchor="middle" class="n">atomic CC index, then Pending</text><text x="875" y="460" text-anchor="middle" class="n">runner owns invocation</text>
  <rect x="500" y="390" width="190" height="84" class="b" fill="#f3ecfa" stroke="#77559a"/><text x="595" y="420" text-anchor="middle" class="t">Task execution</text><text x="595" y="442" text-anchor="middle" class="n">invocation context</text><text x="595" y="460" text-anchor="middle" class="n">typed result or error</text>
  <rect x="205" y="390" width="225" height="84" class="b" fill="#e8f3ec" stroke="#3f7d5c"/><text x="318" y="420" text-anchor="middle" class="t">Terminal or retry update</text><text x="318" y="442" text-anchor="middle" class="n">persist outcome + history</text><text x="318" y="460" text-anchor="middle" class="n">release owner and CC slot</text>
  <path d="M1063 228V330H875V382" class="l"/><path d="M780 432H698" class="l"/><path d="M500 432H438" class="l"/><path d="M318 390V330H580V256" class="l"/>
  <text x="48" y="555" class="s">Recovery path: stale Pending/Running -&gt; recovery status -&gt; Rerouted -&gt; broker -&gt; new claim</text>
</svg>
