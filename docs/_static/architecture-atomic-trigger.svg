<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Rustvello trigger and atomic-service coordination flow</title><desc id="desc">Eligible runners heartbeat, elect one atomic-service executor, recover stale work, evaluate persisted triggers, record trigger evidence, submit matched tasks, and record the service interval.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#52606d"/></marker><style>.h{font:700 25px Inter,system-ui;fill:#24313d}.s{font:13px Inter,system-ui;fill:#52606d}.t{font:600 14px Inter,system-ui;fill:#24313d}.n{font:12px Inter,system-ui;fill:#52606d}.b{stroke-width:2;rx:7}.l{stroke:#52606d;stroke-width:1.7;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="590" fill="#f8fafb"/><text x="48" y="48" class="h">Atomic service and trigger loop</text><text x="48" y="73" class="s">One eligible runner coordinates global work for each service window</text>
  <rect x="45" y="155" width="185" height="92" class="b" fill="#eaf7f6" stroke="#2f7f78"/><text x="138" y="186" text-anchor="middle" class="t">Management loops</text><text x="138" y="210" text-anchor="middle" class="n">runner A, B, C...</text><text x="138" y="230" text-anchor="middle" class="n">periodic checks</text>
  <rect x="280" y="155" width="200" height="92" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="380" y="186" text-anchor="middle" class="t">Heartbeat registry</text><text x="380" y="210" text-anchor="middle" class="n">active + eligible runners</text><text x="380" y="230" text-anchor="middle" class="n">orchestrator recovery trait</text>
  <rect x="530" y="155" width="190" height="92" class="b" fill="#f3ecfa" stroke="#77559a"/><text x="625" y="186" text-anchor="middle" class="t">Election</text><text x="625" y="210" text-anchor="middle" class="n">deterministic eligibility</text><text x="625" y="230" text-anchor="middle" class="n">one executor proceeds</text>
  <path d="M230 201H272" class="l"/><path d="M480 201H522" class="l"/>
  <rect x="780" y="105" width="190" height="92" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="875" y="136" text-anchor="middle" class="t">Recovery pass</text><text x="875" y="160" text-anchor="middle" class="n">stale pending/running</text><text x="875" y="180" text-anchor="middle" class="n">reroute safely</text>
  <rect x="780" y="230" width="190" height="105" class="b" fill="#fff0f4" stroke="#a44e69"/><text x="875" y="261" text-anchor="middle" class="t">TriggerManager</text><text x="875" y="285" text-anchor="middle" class="n">evaluate JSON context</text><text x="875" y="306" text-anchor="middle" class="n">claim trigger run</text><text x="875" y="326" text-anchor="middle" class="n">record participants</text>
  <path d="M720 184L772 157" class="l"/><path d="M720 218L772 270" class="l"/>
  <rect x="1015" y="230" width="145" height="105" class="b" fill="#e8f3ec" stroke="#3f7d5c"/><text x="1088" y="261" text-anchor="middle" class="t">Submit task</text><text x="1088" y="285" text-anchor="middle" class="n">new invocation</text><text x="1088" y="306" text-anchor="middle" class="n">normal app path</text>
  <path d="M970 282H1007" class="l"/>
  <rect x="500" y="415" width="250" height="90" class="b" fill="#edf2f7" stroke="#60758a"/><text x="625" y="446" text-anchor="middle" class="t">Atomic-service timeline</text><text x="625" y="470" text-anchor="middle" class="n">persist runner, start, and end</text><text x="625" y="490" text-anchor="middle" class="n">used by monitoring and audits</text>
  <rect x="900" y="405" width="260" height="100" class="b" fill="#eaf7f6" stroke="#2f7f78"/><text x="1030" y="436" text-anchor="middle" class="t">Trigger evidence</text><text x="1030" y="460" text-anchor="middle" class="n">event + run records</text><text x="1030" y="481" text-anchor="middle" class="n">link produced invocation</text>
  <path d="M1088 335V397" class="l"/><path d="M900 455H758" class="l"/><path d="M875 197V375H625V407" class="l"/>
</svg>
