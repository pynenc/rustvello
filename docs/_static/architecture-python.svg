<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Rustvello Python and PyO3 integration flow</title><desc id="desc">Standalone Python calls pass through the package facade, extension module, PyO3 wrappers, and native Rust engine. Pynenc adapters are external consumers.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#52606d"/></marker><style>.h{font:700 25px Inter,system-ui;fill:#24313d}.s{font:13px Inter,system-ui;fill:#52606d}.t{font:600 14px Inter,system-ui;fill:#24313d}.n{font:12px Inter,system-ui;fill:#52606d}.b{stroke-width:2;rx:7}.l{stroke:#52606d;stroke-width:1.7;fill:none;marker-end:url(#a)}.d{stroke-dasharray:7 5}</style></defs>
  <rect width="1200" height="560" fill="#f8fafb"/><text x="48" y="48" class="h">Python boundary</text><text x="48" y="73" class="s">Bindings convert and delegate; orchestration rules remain in Rust</text>
  <rect x="45" y="150" width="185" height="90" class="b" fill="#f3ecfa" stroke="#77559a"/><text x="138" y="183" text-anchor="middle" class="t">Python user code</text><text x="138" y="207" text-anchor="middle" class="n">App, task, invocation</text>
  <rect x="280" y="150" width="190" height="90" class="b" fill="#fff0f4" stroke="#a44e69"/><text x="375" y="180" text-anchor="middle" class="t">Python facade</text><text x="375" y="204" text-anchor="middle" class="n">py-rustvello/rustvello</text><text x="375" y="223" text-anchor="middle" class="n">ergonomics and decorators</text>
  <rect x="520" y="150" width="190" height="90" class="b" fill="#fff0f4" stroke="#a44e69"/><text x="615" y="180" text-anchor="middle" class="t">Extension module</text><text x="615" y="204" text-anchor="middle" class="n">py-rustvello cdylib</text><text x="615" y="223" text-anchor="middle" class="n">class registration</text>
  <rect x="760" y="135" width="200" height="120" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="860" y="168" text-anchor="middle" class="t">rustvello-python</text><text x="860" y="192" text-anchor="middle" class="n">PyO3 conversion</text><text x="860" y="213" text-anchor="middle" class="n">typed exception mapping</text><text x="860" y="234" text-anchor="middle" class="n">runtime and GIL handoff</text>
  <rect x="1010" y="150" width="150" height="90" class="b" fill="#e8f3ec" stroke="#3f7d5c"/><text x="1085" y="180" text-anchor="middle" class="t">Rust engine</text><text x="1085" y="204" text-anchor="middle" class="n">app + traits</text><text x="1085" y="223" text-anchor="middle" class="n">backends</text>
  <path d="M230 195H272" class="l"/><path d="M470 195H512" class="l"/><path d="M710 195H752" class="l"/><path d="M960 195H1002" class="l"/>
  <rect x="45" y="365" width="260" height="100" class="b" fill="#edf2f7" stroke="#60758a" stroke-dasharray="7 5"/><text x="175" y="398" text-anchor="middle" class="t">External Pynenc adapter</text><text x="175" y="422" text-anchor="middle" class="n">not a workspace package</text><text x="175" y="443" text-anchor="middle" class="n">owns Pynenc-specific ABC mapping</text>
  <path d="M305 415H615V248" class="l d"/>
  <text x="645" y="410" class="t">Stable integration contract</text><text x="645" y="436" class="n">language-qualified TaskId + serialized DTOs + typed errors + Rust composites</text>
</svg>
