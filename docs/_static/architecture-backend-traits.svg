<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Rustvello backend trait implementation flow</title><desc id="desc">Application services call composite core traits implemented by backend crates and checked by the shared compliance suite.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#52606d"/></marker><style>.h{font:700 25px Inter,system-ui;fill:#24313d}.s{font:13px Inter,system-ui;fill:#52606d}.t{font:600 14px Inter,system-ui;fill:#24313d}.n{font:12px Inter,system-ui;fill:#52606d}.b{stroke-width:2;rx:7}.l{stroke:#52606d;stroke-width:1.6;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="590" fill="#f8fafb"/><text x="48" y="48" class="h">Backend contracts</text><text x="48" y="73" class="s">Behavior is defined by core traits and verified across backend implementations</text>
  <rect x="55" y="205" width="190" height="110" class="b" fill="#eaf7f6" stroke="#2f7f78"/><text x="150" y="240" text-anchor="middle" class="t">Application services</text><text x="150" y="265" text-anchor="middle" class="n">app, runner, monitor</text><text x="150" y="286" text-anchor="middle" class="n">Python composites, CLI</text>
  <rect x="315" y="95" width="220" height="76" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="425" y="125" text-anchor="middle" class="t">Broker traits</text><text x="425" y="147" text-anchor="middle" class="n">core, query, routing</text>
  <rect x="315" y="190" width="220" height="116" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="425" y="220" text-anchor="middle" class="t">Orchestrator traits</text><text x="425" y="243" text-anchor="middle" class="n">status, lifecycle, concurrency</text><text x="425" y="264" text-anchor="middle" class="n">blocking, query, recovery</text><text x="425" y="285" text-anchor="middle" class="n">atomic-service timeline</text>
  <rect x="315" y="325" width="220" height="90" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="425" y="355" text-anchor="middle" class="t">State backend traits</text><text x="425" y="378" text-anchor="middle" class="n">core, query, runner</text><text x="425" y="398" text-anchor="middle" class="n">workflow and history</text>
  <rect x="315" y="435" width="220" height="76" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="425" y="465" text-anchor="middle" class="t">Trigger / client data</text><text x="425" y="487" text-anchor="middle" class="n">specialized stores</text>
  <path d="M245 240L307 133" class="l"/><path d="M245 255H307" class="l"/><path d="M245 275L307 370" class="l"/><path d="M245 292L307 465" class="l"/>
  <rect x="635" y="105" width="230" height="105" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="750" y="136" text-anchor="middle" class="t">Local implementations</text><text x="750" y="160" text-anchor="middle" class="n">memory and SQLite</text><text x="750" y="182" text-anchor="middle" class="n">single-process atomicity</text>
  <rect x="635" y="250" width="230" height="130" class="b" fill="#fff0f4" stroke="#a44e69"/><text x="750" y="282" text-anchor="middle" class="t">Distributed implementations</text><text x="750" y="306" text-anchor="middle" class="n">Redis, PostgreSQL, MongoDB</text><text x="750" y="328" text-anchor="middle" class="n">backend-native atomicity</text><text x="750" y="350" text-anchor="middle" class="n">RabbitMQ broker transport</text>
  <path d="M535 205L627 166" class="l"/><path d="M535 275L627 300" class="l"/><path d="M535 370L627 342" class="l"/>
  <rect x="940" y="190" width="210" height="145" class="b" fill="#f3ecfa" stroke="#77559a"/><text x="1045" y="225" text-anchor="middle" class="t">Compliance suite</text><text x="1045" y="250" text-anchor="middle" class="n">shared behavior macros</text><text x="1045" y="273" text-anchor="middle" class="n">required contracts</text><text x="1045" y="296" text-anchor="middle" class="n">Docker integration lanes</text><text x="1045" y="319" text-anchor="middle" class="n">stress and recovery tests</text>
  <path d="M940 235L873 184" class="l"/><path d="M940 292L873 313" class="l"/>
  <text x="635" y="490" class="s">Required methods are implemented and exercised; backend facts do not become feature opt-outs.</text>
</svg>
