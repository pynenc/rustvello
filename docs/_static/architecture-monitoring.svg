<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Rustvello monitoring data flow</title><desc id="desc">Axum routes query backend trait objects, including trigger evidence from full store backends, through AppInstance and render Askama, HTMX, and SVG views for a browser.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#52606d"/></marker><style>.h{font:700 25px Inter,system-ui;fill:#24313d}.s{font:13px Inter,system-ui;fill:#52606d}.t{font:600 14px Inter,system-ui;fill:#24313d}.n{font:12px Inter,system-ui;fill:#52606d}.b{stroke-width:2;rx:7}.l{stroke:#52606d;stroke-width:1.7;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="590" fill="#f8fafb"/><text x="48" y="48" class="h">Monitoring data flow</text><text x="48" y="73" class="s">Views reflect backend facts through the same public contracts used by the engine</text>
  <rect x="45" y="180" width="165" height="90" class="b" fill="#f3ecfa" stroke="#77559a"/><text x="128" y="212" text-anchor="middle" class="t">Browser</text><text x="128" y="236" text-anchor="middle" class="n">HTML + HTMX</text><text x="128" y="256" text-anchor="middle" class="n">operator actions</text>
  <rect x="260" y="165" width="180" height="120" class="b" fill="#eaf7f6" stroke="#2f7f78"/><text x="350" y="198" text-anchor="middle" class="t">Axum routes</text><text x="350" y="222" text-anchor="middle" class="n">query and validation</text><text x="350" y="243" text-anchor="middle" class="n">CSRF on mutations</text><text x="350" y="264" text-anchor="middle" class="n">typed route errors</text>
  <rect x="490" y="165" width="190" height="120" class="b" fill="#eaf1fb" stroke="#4f75a8"/><text x="585" y="198" text-anchor="middle" class="t">AppState / AppInstance</text><text x="585" y="222" text-anchor="middle" class="n">selected app</text><text x="585" y="243" text-anchor="middle" class="n">config + task IDs</text><text x="585" y="264" text-anchor="middle" class="n">backend trait objects</text>
  <path d="M210 225H252" class="l"/><path d="M440 225H482" class="l"/>
  <rect x="740" y="100" width="180" height="76" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="830" y="130" text-anchor="middle" class="t">Broker</text><text x="830" y="152" text-anchor="middle" class="n">queue and routing</text>
  <rect x="740" y="195" width="180" height="76" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="830" y="225" text-anchor="middle" class="t">Orchestrator</text><text x="830" y="247" text-anchor="middle" class="n">status and runners</text>
  <rect x="740" y="290" width="180" height="76" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="830" y="320" text-anchor="middle" class="t">State / client data</text><text x="830" y="342" text-anchor="middle" class="n">history and results</text>
  <rect x="740" y="385" width="180" height="76" class="b" fill="#fff4e6" stroke="#b56d24"/><text x="830" y="415" text-anchor="middle" class="t">Trigger store</text><text x="830" y="437" text-anchor="middle" class="n">optional event + run data</text>
  <path d="M680 198L732 150" class="l"/><path d="M680 225H732" class="l"/><path d="M680 252L732 316" class="l"/><path d="M680 270L732 400" class="l"/>
  <rect x="985" y="165" width="170" height="120" class="b" fill="#fff0f4" stroke="#a44e69"/><text x="1070" y="198" text-anchor="middle" class="t">Renderers</text><text x="1070" y="222" text-anchor="middle" class="n">Askama templates</text><text x="1070" y="243" text-anchor="middle" class="n">family trees</text><text x="1070" y="264" text-anchor="middle" class="n">SVG timelines</text>
  <path d="M920 138H955V190H977" class="l"/><path d="M920 233H977" class="l"/><path d="M920 328H955V260H977" class="l"/><path d="M920 423H955V278H977" class="l"/><path d="M985 270H955V500H350V293" class="l"/>
  <text x="48" y="550" class="s">Mutating routes call normal backend methods; they never write lifecycle or trigger records directly.</text>
</svg>
